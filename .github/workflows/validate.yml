name: validate-bundle
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Static validation (frontmatter, caps, refs, manifests, secrets)
        run: ./scripts/validate-bundle.sh
      - name: Installer self-test (install -> status -> uninstall in throwaway HOME)
        run: ./scripts/install-skill-bundle.sh self-test
