min_version = "2026.4.27"

[settings]
locked = true
npm.package_manager = "npm"
# The github backend otherwise calls the GitHub release API at install time to fetch SLSA
# provenance and artifact attestations. Unauthenticated that request is rate-limited to
# failure, which would make GITHUB_TOKEN a second bootstrap prerequisite. The reviewed
# per-platform checksum in mise.lock is the integrity control instead, exactly as it is for
# every aqua-backed tool here.
github.slsa = false
github.github_attestations = false

[tools]
# mise is the only managed-tool bootstrap. Runtime readiness is checked separately.
uv = "0.11.17"
lefthook = "2.1.10"
node = "22.22.3"
bun = "1.3.10"
# Pinned separately from node because node 22.22.3 bundles npm 10.9.8. The M0b Mermaid
# provisioner resolves this exact npm through `mise where` and installs the renderer's
# node_modules with it, so the npm identity is part of that supply chain, not a bootstrap
# prerequisite: nothing in `mise run check` invokes it.
# depends is load-bearing, not decoration: this is an npm:-backend tool whose own installer IS
# npm, so without the edge mise scheduled it in the first pass and `npm install -g npm@10.8.1`
# failed with "No such file or directory" on a machine that had no npm yet. That single failure
# then skipped every other npm-backend pin. A container proved it: first `mise --locked install`
# exited 1, the second exited 0.
npm = { version = "10.8.1", depends = ["node"] }
# Convenience tier: pinned so every host resolves the same binary, but no gate depends on
# them. Absence degrades developer experience; it never changes a gate verdict.
ripgrep = "15.2.0"
fd = "10.4.2"
jq = "1.8.2"
gh = "2.97.0"

[tools."npm:@os-eco/seeds-cli"]
version = "0.5.14"
depends = ["node"]

# Not in the mise registry, so the backend is named explicitly. github: locks per-platform
# checksums and verifies GitHub artifact attestations on install; ubi: is deprecated in
# mise 2027.1.0 and would lock version+backend only.
[tools."github:betterleaks/betterleaks"]
version = "1.7.3"

# npm backend locks version+backend only, with no per-platform checksum, exactly like the
# Seeds pin above. Rendering is advisory; no gate consumes mmdc.
[tools."npm:@mermaid-js/mermaid-cli"]
version = "11.16.0"
depends = ["node"]

# Installed by default as of 2026-08-06 by explicit operator decision (docs/adr/0005). The
# boundary is usage-level, not packaging-level: per docs/adr/0003 this gateway may route to
# NON-Anthropic models through each provider's own credential (API key, Codex OAuth), and
# Claude subscription OAuth is never routed through it. scripts/opencodex-claude.sh enforces
# that in code. npm backend locks version+backend only, exactly like the two pins above.
[tools."npm:@bitkyc08/opencodex"]
version = "2.10.2"
depends = ["node"]

[tasks.validate]
description = "Run the portable bundle validator"
run = "uv run --python 3.12.11 --script scripts/validate_bundle.py"
run_windows = "uv.exe run --python 3.12.11 --script scripts/validate_bundle.py"

[tasks."bundle:install"]
description = "Install the skill bundle on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install"

[tasks."bundle:status"]
description = "Report this host's skill-bundle lifecycle status"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py status"

[tasks."bundle:uninstall"]
description = "Uninstall skill-bundle entries owned on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py uninstall"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py uninstall"

[tasks."bundle:install:claude"]
description = "Install the skill bundle for Claude on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent claude"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent claude"

[tasks."bundle:install:codex"]
description = "Install the skill bundle for Codex on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent codex"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent codex"

[tasks."bundle:install:all-hosts"]
description = "Install on WSL and the paired native Windows host"
run = "uv run --python 3.12.11 --script scripts/run_all_hosts.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install"

[tasks."bundle:status:all-hosts"]
description = "Report lifecycle status on WSL and the paired native Windows host"
run = "uv run --python 3.12.11 --script scripts/run_all_hosts.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py status"

[tasks."research-os:install"]
description = "Install the repo-scoped Codex Research OS"
run = "uv run --python 3.12.11 --script skills/codex-research-os/scripts/install_research_os.py"
run_windows = "uv.exe run --python 3.12.11 --script skills/codex-research-os/scripts/install_research_os.py"

# M0b Linux Mermaid renderer. Provisioning downloads a pinned browser and is an explicit
# operator step, never a bootstrap prerequisite: `check` does not depend on either task, and
# `mise run check` stays green on a host that has never run `mermaid:provision`. The bounded
# tests_linux suite skips with a named reason when the runtime receipt is absent.
[tasks."mermaid:provision"]
description = "Provision the pinned Linux Mermaid browser runtime (explicit, not a gate)"
run = "uv run --python 3.12.11 --script scripts/provision_mermaid_linux.py"

[tasks."mermaid:linux-test"]
description = "Run bounded Linux Mermaid renderer tests"
run = "uv run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests_linux"
run_windows = "uv.exe run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests_linux"

[tasks.test]
description = "Run the Python installer tests"
run = "uv run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests"
run_windows = "uv.exe run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests"

[tasks.self-test]
description = "Verify installer lifecycle safety in a throwaway home"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py self-test"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py self-test"

[tasks.secrets]
description = "Scan the working tree for secrets with the pinned scanner"
# Working tree only. The full-history verb (`betterleaks git .`) is deliberately NOT wired:
# scanning history is a separate, consent-requiring pre-publish step, not a commit gate.
# --config is explicit because the scanner otherwise auto-loads a drop-in .gitleaks.toml or
# .betterleaks.toml from cwd and honors GITLEAKS_CONFIG*/BETTERLEAKS_CONFIG*, so an untracked
# `[extend] useDefault = false` file would silently replace the ruleset and neuter the scan
# while every pinned fixture stayed green; the flag has highest precedence and defeats both.
# Exit code is the whole result: 0 clean, 1 findings. A clean scan is evidence, not authority.
run = "betterleaks dir . --config .config/betterleaks.toml"
run_windows = "betterleaks dir . --config .config/betterleaks.toml"

[tasks.check]
description = "Run validation, installer tests, lifecycle self-test, and the secrets scan"
depends = ["validate", "test", "self-test", "secrets"]

[tasks."operator-tools:install"]
description = "Install statusline and opencodex launch commands into an existing user PATH"
run = "uv run --python 3.12.11 --script scripts/install_operator_tools.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_operator_tools.py install"

[tasks."operator-tools:status"]
description = "Report lifecycle status for the PATH-installed operator commands"
run = "uv run --python 3.12.11 --script scripts/install_operator_tools.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_operator_tools.py status"

[tasks."operator-tools:uninstall"]
description = "Remove unchanged owned operator commands"
run = "uv run --python 3.12.11 --script scripts/install_operator_tools.py uninstall"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_operator_tools.py uninstall"

[tasks."operator-tools:self-test"]
description = "Exercise operator command lifecycle in an isolated home"
run = "uv run --python 3.12.11 --script scripts/install_operator_tools.py self-test"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_operator_tools.py self-test"

# Opt-in third-party skill library installs (docs/adr/0009). Explicit and separate from
# `bundle:install`: no task here is a dependency of `setup`, `check`, or any gate leaf, and
# `install` refuses without an explicitly named library. Front doors are each library's own
# installer, so no bytes enter this repository and no bootstrap prerequisite is added.
[tasks."libraries:list"]
description = "List installable external skill libraries, their front doors, and their surface cost"
run = "uv run --python 3.12.11 --script scripts/install_external_libraries.py list"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_external_libraries.py list"

[tasks."libraries:install"]
description = "Install explicitly named external skill libraries through their own front doors (dry run without --yes)"
run = "uv run --python 3.12.11 --script scripts/install_external_libraries.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_external_libraries.py install"

[tasks."libraries:status"]
description = "Report which external skill libraries are already present in this home"
run = "uv run --python 3.12.11 --script scripts/install_external_libraries.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_external_libraries.py status"

[tasks."libraries:migrate"]
description = "Retire another channel's copies of the same upstream through that channel's own removal path, then install (dry run without --yes)"
run = "uv run --python 3.12.11 --script scripts/install_external_libraries.py migrate"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_external_libraries.py migrate"

[tasks."claude:statusline:status"]
description = "Inspect the optional managed Claude Code statusline"
run = "uv run --python 3.12.11 --script scripts/manage_claude_statusline.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/manage_claude_statusline.py status"

[tasks."claude:statusline:activate"]
description = "Explicitly activate the owned packaged Claude Code statusline"
run = "uv run --python 3.12.11 --script scripts/manage_claude_statusline.py activate"
run_windows = "uv.exe run --python 3.12.11 --script scripts/manage_claude_statusline.py activate"

[tasks."claude:statusline:deactivate"]
description = "Restore only the Claude Code statusline fields managed at activation"
run = "uv run --python 3.12.11 --script scripts/manage_claude_statusline.py deactivate"
run_windows = "uv.exe run --python 3.12.11 --script scripts/manage_claude_statusline.py deactivate"

[tasks."ocx:launch"]
description = "Launch a second Claude Code process through the opencodex gateway"
run = "scripts/opencodex-claude.sh launch"

[tasks."ocx:ultracode"]
description = "Launch opencodex Claude with session Ultracode and ordinary permissions"
run = "scripts/opencodex-claude.sh launch-ultracode"

[tasks."ocx:status"]
description = "Report opencodex gateway reachability and configured providers"
run = "scripts/opencodex-claude.sh status"

[tasks."ocx:restart"]
description = "Stop the opencodex gateway cleanly and ensure it is healthy again"
run = "scripts/opencodex-claude.sh restart"

[tasks."ocx:configure"]
description = "Configure opencodex providers through their own login flows"
run = "scripts/opencodex-claude.sh configure"

[tasks."muse:launch"]
description = "Launch Claude Code on the Muse Spark FALLBACK direct route (primary is ocx:launch --model muse/muse-spark-1.2)"
run = "scripts/muse-claude.sh launch"

[tasks."muse:status"]
description = "Report Muse Spark fallback-route configuration, credential source, and live reachability"
run = "scripts/muse-claude.sh status"

[tasks."muse:probe"]
description = "Verify the Muse Spark fallback route's catalog and one tiny completion without launching Claude"
run = "scripts/muse-claude.sh probe"

[tasks."hooks:install"]
description = "Install this repository's lefthook hooks"
run = "lefthook install"

[tasks.setup]
description = "Install this host's bundle and Git hooks"
depends = ["bundle:install", "hooks:install"]
