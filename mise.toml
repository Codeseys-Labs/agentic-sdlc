min_version = "2026.4.27"

[settings]
locked = true
npm.package_manager = "npm"
# The github backend otherwise calls the GitHub release API at install time to fetch SLSA
# provenance and artifact attestations. Unauthenticated that request is rate-limited to
# failure, which would make GITHUB_TOKEN a second bootstrap prerequisite. The reviewed
# per-platform checksum in mise.lock is the integrity control instead, exactly as it is for
# every aqua-backed tool here.
github.slsa = false
github.github_attestations = false

[tools]
# mise is the only managed-tool bootstrap. Runtime readiness is checked separately.
uv = "0.11.17"
lefthook = "2.1.10"
node = "22.22.3"
bun = "1.3.10"
# Convenience tier: pinned so every host resolves the same binary, but no gate depends on
# them. Absence degrades developer experience; it never changes a gate verdict.
ripgrep = "15.2.0"
fd = "10.4.2"
jq = "1.8.2"
gh = "2.97.0"

[tools."npm:@os-eco/seeds-cli"]
version = "0.5.14"
depends = ["node"]

# Not in the mise registry, so the backend is named explicitly. github: locks per-platform
# checksums and verifies GitHub artifact attestations on install; ubi: is deprecated in
# mise 2027.1.0 and would lock version+backend only.
[tools."github:betterleaks/betterleaks"]
version = "1.7.3"

# npm backend locks version+backend only, with no per-platform checksum, exactly like the
# Seeds pin above. Rendering is advisory; no gate consumes mmdc.
[tools."npm:@mermaid-js/mermaid-cli"]
version = "11.16.0"
depends = ["node"]

[tasks.validate]
description = "Run the portable bundle validator"
run = "uv run --python 3.12.11 --script scripts/validate_bundle.py"
run_windows = "uv.exe run --python 3.12.11 --script scripts/validate_bundle.py"

[tasks."bundle:install"]
description = "Install the skill bundle on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install"

[tasks."bundle:status"]
description = "Report this host's skill-bundle lifecycle status"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py status"

[tasks."bundle:uninstall"]
description = "Uninstall skill-bundle entries owned on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py uninstall"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py uninstall"

[tasks."bundle:install:claude"]
description = "Install the skill bundle for Claude on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent claude"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent claude"

[tasks."bundle:install:codex"]
description = "Install the skill bundle for Codex on this host"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent codex"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install --agent codex"

[tasks."bundle:install:all-hosts"]
description = "Install on WSL and the paired native Windows host"
run = "uv run --python 3.12.11 --script scripts/run_all_hosts.py install"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py install"

[tasks."bundle:status:all-hosts"]
description = "Report lifecycle status on WSL and the paired native Windows host"
run = "uv run --python 3.12.11 --script scripts/run_all_hosts.py status"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py status"

[tasks."research-os:install"]
description = "Install the repo-scoped Codex Research OS"
run = "uv run --python 3.12.11 --script skills/codex-research-os/scripts/install_research_os.py"
run_windows = "uv.exe run --python 3.12.11 --script skills/codex-research-os/scripts/install_research_os.py"

[tasks.test]
description = "Run the Python installer tests"
run = "uv run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests"
run_windows = "uv.exe run --python 3.12.11 --with pyyaml==6.0.3 python -m unittest discover -s tests"

[tasks.self-test]
description = "Verify installer lifecycle safety in a throwaway home"
run = "uv run --python 3.12.11 --script scripts/install_skill_bundle.py self-test"
run_windows = "uv.exe run --python 3.12.11 --script scripts/install_skill_bundle.py self-test"

[tasks.check]
description = "Run validation, installer tests, and lifecycle self-test"
depends = ["validate", "test", "self-test"]

[tasks."hooks:install"]
description = "Install this repository's lefthook hooks"
run = "lefthook install"

[tasks.setup]
description = "Install this host's bundle and Git hooks"
depends = ["bundle:install", "hooks:install"]
